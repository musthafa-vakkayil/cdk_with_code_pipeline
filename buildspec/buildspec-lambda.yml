version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: latest
    commands:
      - cd src
      - npm ci
  build:
    commands:
      - npm run build

artifacts:
  base-directory: src/dist  # Ensures only contents inside src/dist are included
  files:
    - '**/*'  # Includes everything inside src/dist
  discard-paths: no
